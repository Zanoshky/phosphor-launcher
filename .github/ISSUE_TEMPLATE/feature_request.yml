name: Feature request
description: An idea for something Phosphor could do.
title: "[idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What you want
      description: Describe the feature in a few lines.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What would it help you do? A real example helps.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: "Which page, layout or screen?"
      options:
        - dashboard
        - inbox
        - weather
        - agenda
        - media
        - radio
        - apps
        - monitor
        - today
        - notes
        - zen
        - a tool (todo, pomodoro, calc, world, sky, battery, storage, fetch, meeting)
        - search or commands
        - edit mode
        - settings
        - setup or tour
        - lock screen
        - link devices
        - other
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Pictures or links
      description: A sketch, a screenshot or a link to something similar.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the open issues and this idea is not there yet.
          required: true
